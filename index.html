<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>太陽系ラボ</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ipad.css"></head><body><header><span class="brand">✦ 太陽系ラボ</span><div><button id="explore">自由に観察</button><button id="full">⛶ 全画面</button></div></header><main><nav aria-label="観察モード"><button data-mode="orbit" class="active">公転</button><button data-mode="spin">自転</button><button data-mode="size">大きさ</button><button data-mode="distance">距離</button></nav><section id="activity" aria-label="観察ミッション"><div class="taskhead"><span id="taskStep">1 予想</span><h1 id="question"></h1><button id="restartTask" aria-label="ミッションをやり直す">↺</button></div><div id="answers"></div><div class="taskactions"><p id="taskMessage" aria-live="polite"></p><button id="check" hidden>結果を確かめる</button></div></section><section class="toolbar"><span id="viewTitle">太陽のまわりを回る</span><div id="orbitControls"><button data-view="all" class="on">太陽系全体</button><button data-view="inner">内側を拡大</button></div><div id="scaleControls" hidden><label><input id="sunCheck" type="checkbox"> 太陽も比べる</label></div></section><div class="lab"><div class="visual"><section id="stage"><canvas id="space" aria-label="惑星の動きとスケールの図。下の惑星ボタンでも選択できます。"></canvas><div class="badge" id="badge"></div><div id="stageTip"></div></section><div id="planets" aria-label="惑星を選ぶ"></div></div><div class="controls"><section class="bottom"><div class="readout"><span id="metricLabel"></span><strong id="metric"></strong><span id="compare"></span></div><div class="transport"><div class="playrow"><button id="play">▶ 再生</button><button id="reset">↺ 時間を戻す</button><span id="clock">0日</span></div><label>速さ <input id="speed" type="range" min="0" max="4" step="1" value="2"><output id="speedOut"></output></label></div></section><section class="scrub" id="scrubArea"><div><label for="scrub">時間を動かす</label><span id="rangeLabel"></span></div><input id="scrub" type="range" min="0" max="3652" value="0" step="0.001"><div class="stepbuttons"><button id="year">地球が1周 ＋</button><button id="selectedCycle">選んだ惑星が1周 ＋</button></div></section></div></div><footer><span id="note"></span><a href="https://nssdc.gsfc.nasa.gov/planetary/factsheet/" target="_blank" rel="noopener">データ：NASA ↗</a></footer></main><script src="app.js"></script><script src="ipad.js"></script></body></html>
